name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev-debugging ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    # We start Redis and Kafka as "Services" for the tests to talk to
    services:
      redis:
        image: bitnamilegacy/redis:7.2.4
        ports:
          - 6379:6379
      zookeeper:
        image: bitnamilegacy/zookeeper:3.9.1
        ports:
          - 2181:2181
        env:
          ALLOW_ANONYMOUS_LOGIN: yes
      kafka:
        image: bitnamilegacy/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          ALLOW_PLAINTEXT_LISTENER: yes
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Give Kafka and Zookeeper time to finish their boot sequence
      - name: Wait for services
        run: sleep 30s

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          # Set environment variables so the app points to the service containers
          export REDIS_URL=redis://localhost:6379/0
          export KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          python -m pytest backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build